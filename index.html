<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC 사이클 밸류에이션 대시보드</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            color: #f59e0b;
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background-color: #334155;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .card h3 {
            margin: 0 0 10px 0;
            color: #cbd5e1;
            font-size: 1rem;
        }
        .card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #38bdf8;
        }
        .nav-link {
            text-align: center;
            margin-top: 20px;
        }
        .nav-link a {
            color: #f59e0b;
            text-decoration: none;
            font-weight: bold;
        }
        .nav-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 BTC 사이클 밸류에이션 대시보드</h1>
        <p class="subtitle">비트코인 반감기 사이클 및 온체인 밸류에이션 지표 모니터링</p>

        <div class="card-grid">
            <div class="card">
                <h3>비트코인 사이클 위치</h3>
                <div class="value">강세장 중반</div>
            </div>
            <div class="card">
                <h3>MVRV Z-Score</h3>
                <div class="value">2.15 (정상)</div>
            </div>
            <div class="card">
                <h3>상대적 밸류에이션</h3>
                <div class="value" style="color: #4ade80;">적정 평가</div>
            </div>
        </div>

        <div class="nav-link">
            <a href="https://suby716-cmd.github.io/btc-radar/" target="_blank">📡 기존 BTC 상대강도 레이더로 이동하기 ➔</a>
        </div>
    </div>
</body>
</html>
